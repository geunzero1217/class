<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 진행</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="admin.html" title="관리 화면" data-ic="back"></a>
    <span class="title" id="className">수업</span>
    <span class="code-pill" id="codePill" title="누르면 크게 보기 (학생에게 보여 주세요)">------</span>
    <span class="pill" id="conn">연결 중…</span>
    <span class="seg" id="modes">
      <button data-mode="wait" data-ic="pause">대기</button>
      <button data-mode="slides" data-ic="doc">슬라이드</button>
      <button data-mode="web" data-ic="globe">웹페이지</button>
      <button data-mode="screen" data-ic="monitor">화면 공유</button>
      <button data-mode="board" data-ic="board">칠판</button>
    </span>
    <span class="spacer"></span>
    <button id="sendFileBtn" data-ic="clip" title="고른 파일을 이 수업의 학생들에게 보내요 (학생 화면 위쪽에 내려받기 버튼이 생겨요)">파일 보내기</button>
    <input id="sendIn" type="file" multiple hidden>
    <button id="pipBtn" data-ic="pin" title="PowerPoint 등 다른 프로그램 위에도 떠 있는 작은 학생 현황 창">학생 현황 창</button>
    <button id="endBtn" class="danger" data-ic="stop" title="수업을 끝내고 출석을 마감해요">수업 종료</button>
  </div>
  <div class="code-big" id="codeBig" hidden>
    <div>
      <div class="lbl">접속 주소</div>
      <div class="u" id="cbUrl"></div>
      <div class="lbl" style="margin-top:30px">수업 코드</div>
      <div class="c" id="cbCode"></div>
      <div class="qr" id="cbQr"></div>
      <div class="close">아무 곳이나 누르면 닫혀요</div>
    </div>
  </div>
  <div class="code-big" id="endedView" hidden>
    <div><div style="font-size:34px;font-weight:700;letter-spacing:-0.02em" id="endedMsg">수업이 끝났어요</div>
      <div style="margin-top:22px"><a href="admin.html"><button class="primary" style="padding:14px 22px;font-size:16px">관리 화면으로 (출석 확인)</button></a></div></div>
  </div>

  <div class="layout">
    <main id="main">
      <div class="subbar">
        <div class="grp" data-for="wait"><span class="muted">학생 화면에 "수업 화면을 준비 중입니다"가 보여요.</span></div>
        <div class="grp" data-for="slides">
          <select id="deckSel" style="max-width:260px"></select>
          <button id="uploadBtn" data-ic="upload">자료 올리기</button>
          <input id="fileIn" type="file" accept=".pdf,image/*,.ppt,.pptx" multiple hidden>
          <span id="uploadMsg" class="small"></span>
          <span class="sep"></span>
          <button id="prevBtn" data-ic="prev" title="이전 (←)"></button>
          <span id="pageInfo" style="min-width:64px;text-align:center">-</span>
          <button id="nextBtn" data-ic="next" title="다음 (→, 스페이스)"></button>
        </div>
        <div class="grp" data-for="web" style="flex:1">
          <form id="urlForm" class="row" style="flex:1">
            <input id="urlIn" type="text" placeholder="https://… 보여 줄 웹페이지 주소" style="flex:1;min-width:200px">
            <button class="primary">열기</button>
          </form>
          <span class="small muted">화면 안에 안 열리는 사이트는 화면 공유(탭)를 쓰세요</span>
        </div>
        <div class="grp" data-for="screen">
          <button id="shareBtn" class="primary" data-ic="play">화면 공유 시작</button>
          <button id="stopShareBtn" class="danger" data-ic="stop" hidden>공유 중지</button>
          <span id="shareInfo" class="small" style="color:var(--sub);font-weight:600"></span>
          <span class="sep"></span>
          <label class="small check" title="영상 연결이 안 되는 학생에게 1.2초마다 화면 사진을 보내요. 화질이 낮고 Firebase 무료 사용량을 써요 (한 수업 300MB까지).">
            <input type="checkbox" id="optRelay"> 영상 안 되는 학생에게 사진 보내기</label>
          <button id="micBtn" class="small" data-ic="mic" title="학교 와이파이에서 영상 연결이 잘 안 될 때 한 번 눌러 두세요">영상 연결 돕기</button>
        </div>
        <div class="grp" data-for="board">
          <button id="bPrev" data-ic="prev"></button>
          <span id="boardInfo" style="min-width:64px;text-align:center">1 / 1</span>
          <button id="bNext" data-ic="next"></button>
          <button id="bAdd" data-ic="plus">새 페이지</button>
        </div>
      </div>

      <div id="stageWrap"></div>

      <div class="toolbar" id="toolbar">
        <button data-tool="select" data-ic="cursor" title="선택 (Esc)">선택</button>
        <button data-tool="laser" data-ic="laser" title="레이저 포인터 (L)">레이저</button>
        <button data-tool="pen" data-ic="pen" title="펜 (P)">펜</button>
        <button data-tool="hl" data-ic="hl" title="형광펜 (H)">형광펜</button>
        <button data-tool="eraser" data-ic="eraser" title="지우개 (E)">지우개</button>
        <span class="sep"></span>
        <span id="colors" class="row" style="gap:5px"></span>
        <span class="sep"></span>
        <span id="sizes" class="row" style="gap:5px"></span>
        <span class="sep"></span>
        <button id="undoBtn" data-ic="undo" title="되돌리기 (Ctrl+Z)">되돌리기</button>
        <button id="clearBtn" data-ic="trash">모두 지우기</button>
        <span class="sep"></span>
        <button id="fsBtn" data-ic="expand" title="전체 화면">전체 화면</button>
      </div>

      <div class="mini" id="mini" title="클릭하면 접기/펴기"></div>
      <div class="pip-hint" id="pipHint" hidden>
        <button id="pipHintBtn" data-ic="pin">학생 현황 창 띄우기</button>
        <div class="txt">다른 프로그램을 시연하는 동안에도 화면 위에 작게 떠 있어서<br>이탈한 학생을 바로 볼 수 있어요.</div>
        <div class="txt warn"><b>전체 화면</b>을 공유하면 이 작은 창도 학생 화면에 보여요.<br>학생 이름이 보이는 게 싫으면 화면 구석(공유 안 하는 모니터)에 두세요.</div>
        <button id="pipHintX" class="x" data-ic="x" title="닫기"></button>
      </div>
    </main>

    <aside class="roster">
      <div class="roster-head">
        <div class="counts" id="counts"></div>
        <div class="small muted" id="dispInfo" hidden></div>
        <button id="pracBtn" class="prac-btn" data-ic="tool" title="학생들이 실습하러 다른 프로그램으로 가도 이탈로 세지 않아요">실습 모드 켜기</button>
        <div class="sent-files" id="sentFiles" hidden></div>
        <div class="roster-opts">
          <label><input type="checkbox" id="optSort" checked> 이탈 학생 위로</label>
          <a href="#" id="resetCnt">화면 표시 초기화</a>
        </div>
      </div>
      <div class="roster-list" id="rosterList"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/common.js"></script>
<script type="module">
import {
  r, get, set, update, remove, push, onValue, onChildAdded, onChildChanged, onChildRemoved, serverTimestamp,
  waitAuth, ensureTeacher, now, skey, closeLesson, uploadDeck, SlideCache, iceServers, LATE_MINUTES, setCurrent,
} from './js/fb.js';

const lid = new URLSearchParams(location.search).get('l');
const user = await waitAuth();
if (!lid || !user || user.isAnonymous || !(await ensureTeacher(user))) { location.replace('admin.html'); throw new Error('로그인 필요'); }
const les = (await get(r('lessons/' + lid))).val();
if (!les) { alert('수업을 찾을 수 없어요.'); location.replace('admin.html'); throw new Error('수업 없음'); }
const cid = les.cid;
$('#className').textContent = `${les.className} · ${fmtDate(les.date)} ${les.period}교시`;
$('#codePill').textContent = les.code || '------';
document.title = '수업 · ' + les.className;

let ended = false;
let stream = null;
let key = null, inkUnsubs = [], cur = null, myStack = [];
let lastPtr = 0, ptrTimer = null;
function showEnded(msg) {
  if (ended) return; ended = true;
  if (stream) stopShare();
  $('#endedMsg').textContent = msg || '수업이 끝났어요';
  $('#endedView').hidden = false; document.title = '수업 끝';
}
if (les.status !== 'open') showEnded('이미 끝난 수업이에요');
else setCurrent(lid, les);   // 자리 모니터가 이 수업을 따라오게
onValue(r(`lessons/${lid}/status`), (s) => { if (s.val() !== 'open') showEnded(); });
onValue(r('.info/connected'), (s) => {
  const ok = !!s.val(), c = $('#conn');
  c.textContent = ok ? '서버 연결됨' : '연결 끊김 · 다시 연결 중'; c.className = 'pill ' + (ok ? 'ok' : 'bad');
});

/* ───────── 화면 상태 ───────── */
const stage = new Stage($('#stageWrap'));
let st = { mode: 'wait', deckId: null, page: 0, url: '', board: 0, boardCount: 1, aspect: 16 / 9, sharing: false, shareId: 0 };
const saved = (await get(r('live/' + lid))).val();
if (saved) st = { ...st, ...saved, sharing: false };
let decks = {};
const slides = new SlideCache(() => applyLocal());
const curDeck = () => (st.deckId ? decks[st.deckId] : null);

function sendState() { if (!ended) set(r('live/' + lid), st).catch((e) => toast('저장 실패: ' + e.message)); }
function setState(patch) { Object.assign(st, patch); applyLocal(); sendState(); }
function applyLocal() {
  watchInk();
  const d = curDeck();
  let slide = null;
  if (st.mode === 'slides' && d) {
    slide = slides.url(st.deckId, st.page || 0);
    for (let j = (st.page || 0) + 1; j < Math.min(d.pages.length, (st.page || 0) + 3); j++) slides.url(st.deckId, j);
  }
  renderView(stage, st, d, true, { slide });
  $$('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === st.mode));
  $$('.subbar .grp').forEach((g) => (g.hidden = g.dataset.for !== st.mode));
  $('#deckSel').value = st.deckId || '';
  $('#pageInfo').textContent = d ? `${(st.page || 0) + 1} / ${d.pages.length}` : '-';
  $('#boardInfo').textContent = `${(st.board || 0) + 1} / ${st.boardCount || 1}`;
  if (st.mode === 'web' && document.activeElement !== $('#urlIn')) $('#urlIn').value = st.url || '';
  $('#shareBtn').hidden = !!stream; $('#stopShareBtn').hidden = !stream;
  $('#optRelay').checked = !!st.relay;
}

$$('#modes button').forEach((b) => (b.onclick = () => {
  const mode = b.dataset.mode;
  const patch = { mode };
  const ids = Object.keys(decks);
  if (mode === 'slides' && (!st.deckId || !decks[st.deckId]) && ids.length) { patch.deckId = ids[ids.length - 1]; patch.page = 0; }
  if (mode === 'screen') patch.sharing = !!stream;
  setState(patch);
  if (mode === 'screen' && !stream) shareClick();
  if (mode === 'web' && !st.url) setTimeout(() => $('#urlIn').focus(), 0);
}));

/* 슬라이드 */
onValue(r('decks/' + cid), (s) => {
  decks = s.val() || {};
  $('#deckSel').innerHTML = '<option value="">— 자료 선택 —</option>' +
    Object.entries(decks).map(([id, d]) => `<option value="${id}">${esc(d.name)} (${d.pages.length}장)</option>`).join('');
  if (st.deckId && !decks[st.deckId] && st.mode === 'slides') setState({ deckId: null, page: 0 }); else applyLocal();
});
$('#deckSel').onchange = () => setState({ mode: 'slides', deckId: $('#deckSel').value || null, page: 0 });
function go(delta) {
  if (st.mode === 'slides') {
    const d = curDeck(); if (!d) return;
    const p = Math.max(0, Math.min(d.pages.length - 1, (st.page || 0) + delta));
    if (p !== st.page) setState({ page: p });
  } else if (st.mode === 'board') {
    const b = Math.max(0, Math.min((st.boardCount || 1) - 1, (st.board || 0) + delta));
    if (b !== st.board) setState({ board: b });
  }
}
$('#prevBtn').onclick = () => go(-1); $('#nextBtn').onclick = () => go(1);
$('#bPrev').onclick = () => go(-1); $('#bNext').onclick = () => go(1);
$('#bAdd').onclick = () => { const n = (st.boardCount || 1) + 1; setState({ boardCount: n, board: n - 1 }); };
$('#uploadBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = async () => {
  const files = [...$('#fileIn').files]; $('#fileIn').value = ''; if (!files.length) return;
  $('#uploadBtn').disabled = true;
  try {
    const deck = await uploadDeck(cid, files, (m) => ($('#uploadMsg').textContent = m));
    setState({ mode: 'slides', deckId: deck.id, page: 0 });
    $('#uploadMsg').textContent = `${deck.pages.length}장 올렸어요`;
    setTimeout(() => ($('#uploadMsg').textContent = ''), 4000);
  } catch (er) { $('#uploadMsg').textContent = er.message; }
  finally { $('#uploadBtn').disabled = false; }
};

/* 웹페이지 */
$('#urlForm').onsubmit = (e) => {
  e.preventDefault();
  let u = $('#urlIn').value.trim(); if (!u) return;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  $('#urlIn').value = u; $('#urlIn').blur();
  setState({ mode: 'web', url: u });
};

/* ───────── 필기 ───────── */
function watchInk() {
  const k = stateKey(st);
  if (k === key) return;
  key = k; inkUnsubs.forEach((u) => u()); inkUnsubs = []; stage.ink.clear(); sendPointer(null);
  if (!k) return;
  const ref = r(`ink/${lid}/${k}`);
  const up = (s) => { if (!cur || s.key !== cur.id) stage.ink.upsert(s.key, strokeFromDb(s.val())); };
  inkUnsubs.push(onChildAdded(ref, up), onChildChanged(ref, up), onChildRemoved(ref, (s) => stage.ink.remove(s.key)));
}
const COLORS = ['#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#111827', '#ffffff'];
const SIZES = [2, 4, 8, 14];
let tool = 'select', color = COLORS[0], size = SIZES[1];
$('#colors').innerHTML = COLORS.map((c) => `<button class="swatch" data-color="${c}" style="background:${c}" title="${c}"></button>`).join('');
$('#sizes').innerHTML = SIZES.map((s) => `<button class="size-btn" data-size="${s}" title="굵기 ${s}"><span style="width:${s + 3}px;height:${s + 3}px"></span></button>`).join('');
function setTool(t) {
  tool = t;
  $$('#toolbar [data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t));
  const w = $('#stageWrap');
  w.classList.toggle('drawing', t !== 'select');
  ['laser', 'pen', 'hl', 'eraser'].forEach((x) => w.classList.toggle('t-' + x, x === t));
  if (t !== 'laser') sendPointer(null);
}
function setColor(c) { color = c; $$('#colors .swatch').forEach((b) => b.classList.toggle('on', b.dataset.color === c)); if (tool !== 'pen' && tool !== 'hl') setTool('pen'); }
function setSize(s) { size = s; $$('#sizes button').forEach((b) => b.classList.toggle('on', +b.dataset.size === s)); }
$$('#toolbar [data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
$$('#colors .swatch').forEach((b) => (b.onclick = () => setColor(b.dataset.color)));
$$('#sizes button').forEach((b) => (b.onclick = () => setSize(+b.dataset.size)));
setColor(COLORS[0]); setTool('select'); setSize(SIZES[1]);

const live = stage.ink.live;
const clamp = (v) => Math.max(0, Math.min(1, v));
function pos(e) { const b = live.getBoundingClientRect(); return [clamp((e.clientX - b.left) / b.width), clamp((e.clientY - b.top) / b.height)]; }
let flushTimer = null;
function flush(final) {
  clearTimeout(flushTimer); flushTimer = null;
  if (!cur) return;
  set(r(`ink/${lid}/${cur.key}/${cur.id}`), { t: cur.s.t, c: cur.s.c, s: cur.s.s, p: encPts(cur.s.pts), done: !!final }).catch(() => {});
}
function erasePoint(p) {
  const ids = stage.ink.hit(p[0], p[1], 8);
  if (!ids.length) return;
  const u = {}; ids.forEach((id) => { stage.ink.remove(id); u[`ink/${lid}/${key}/${id}`] = null; });
  update(r(''), u).catch(() => {});
}
function sendPointer(p) {
  const t = performance.now();
  clearTimeout(ptrTimer);
  if (p && t - lastPtr < 50) { ptrTimer = setTimeout(() => sendPointer(p), 50); return; }
  lastPtr = t;
  stage.showLaser(p ? { x: p[0], y: p[1] } : null);
  if (ended) return;
  if (p) set(r('pointer/' + lid), { k: key, x: Math.round(p[0] * 10000) / 10000, y: Math.round(p[1] * 10000) / 10000 }).catch(() => {});
  else remove(r('pointer/' + lid)).catch(() => {});
}
live.addEventListener('pointerdown', (e) => {
  if (tool === 'select') return;
  if (!key) { toast('대기 화면에는 필기할 수 없어요.'); return; }
  e.preventDefault(); live.setPointerCapture(e.pointerId);
  const p = pos(e);
  if (tool === 'pen' || tool === 'hl') {
    const id = push(r(`ink/${lid}/${key}`)).key;
    cur = { id, key, s: { t: tool, c: color, s: size, pts: [p], done: false } };
    stage.ink.upsert(id, cur.s); flush(false);
    myStack.push({ key, id });
  } else if (tool === 'eraser') erasePoint(p);
  else if (tool === 'laser') sendPointer(p);
});
live.addEventListener('pointermove', (e) => {
  if (tool === 'laser') { sendPointer(pos(e)); return; }
  if (tool === 'eraser' && e.buttons) { erasePoint(pos(e)); return; }
  if (!cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  cur.s.pts.push(...(evs.length ? evs : [e]).map(pos));
  stage.ink.upsert(cur.id, cur.s);
  if (!flushTimer) flushTimer = setTimeout(() => flush(false), 60);
});
function endStroke() {
  if (!cur) return;
  cur.s.done = true; stage.ink.upsert(cur.id, cur.s); flush(true); cur = null;
}
live.addEventListener('pointerup', endStroke);
live.addEventListener('pointercancel', endStroke);
live.addEventListener('pointerleave', () => { if (tool === 'laser') sendPointer(null); });
function undo() {
  for (let i = myStack.length - 1; i >= 0; i--) {
    const it = myStack[i];
    if (it.key === key && it.clear) {   // '모두 지우기' 되돌리기 → 지운 획을 다시 저장
      myStack.splice(i, 1);
      const u = {};
      it.clear.forEach(([id, s]) => { stage.ink.strokes.set(id, s); u[`ink/${lid}/${key}/${id}`] = { t: s.t, c: s.c, s: s.s, p: encPts(s.pts), done: true }; });
      stage.ink.renderAll();
      update(r(''), u).catch((e) => toast('복구 실패: ' + e.message));
      toast('지운 필기를 다시 살렸어요'); return;
    }
    if (it.key === key && stage.ink.strokes.has(it.id)) {
      myStack.splice(i, 1); stage.ink.remove(it.id); remove(r(`ink/${lid}/${key}/${it.id}`)).catch(() => {}); return;
    }
  }
  toast('되돌릴 필기가 없어요.');
}
$('#undoBtn').onclick = undo;
$('#clearBtn').onclick = () => {
  if (!key || !stage.ink.strokes.size) return;
  // 확인 창(confirm)을 띄우면 전체 화면이 풀려서, 바로 지우고 되돌리기로 살릴 수 있게 함
  const saved = [...stage.ink.strokes].filter(([, s]) => s.done);
  if (saved.length) myStack.push({ key, clear: saved });
  stage.ink.clear(); remove(r(`ink/${lid}/${key}`)).catch(() => {});
  toast('모두 지웠어요 · 실수였다면 되돌리기(Ctrl+Z)', 4000);
};

/* 전체 화면 / 단축키 */
$('#fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else $('#main').requestFullscreen().catch(() => {}); };
document.addEventListener('fullscreenchange', () => { $('#fsBtn').innerHTML = document.fullscreenElement ? ic('shrink') + '전체 화면 끝' : ic('expand') + '전체 화면'; });
$('#mini').onclick = () => $('#mini').classList.toggle('collapsed');
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(-1); }
  else if (k === 'Escape') setTool('select');

  toast(st.practice ? '실습 모드: 학생이 다른 창으로 가도 이탈로 세지 않아요' : '실습 모드를 껐어요. 이제부터 다시 이탈을 세요');
  renderRoster();
}
$('#pracBtn').onclick = togglePractice;
$('#resetCnt').onclick = (e) => { e.preventDefault(); Object.values(meta).forEach((m) => (m.shown = 0)); renderRoster(); toast('화면의 이탈 표시만 0으로 했어요 (출석 기록은 그대로).'); };

/* 📌 다른 프로그램 위에 떠 있는 학생 목록 창 */
// auto = 화면 공유 시작과 함께 자동으로 여는 경우 (항상 위에 뜨는 창을 못 만들면 조용히 넘어가고 안내만 띄움)
// 새로 열었으면 true
async function openPip(auto = false) {
  if (pipWin && !pipWin.closed) { if (!auto) pipWin.focus(); $('#pipHint').hidden = true; return false; }
  let w = null;
  try { if (window.documentPictureInPicture) w = await documentPictureInPicture.requestWindow({ width: 300, height: 160 }); } catch (_) { w = null; }
  if (!w && auto) return false;
  $('#pipHint').hidden = true;
  if (!w) {
    w = window.open('', 'rosterPip', 'width=300,height=190');
    if (!w) { alert('팝업이 차단되었어요. 주소창 오른쪽에서 팝업을 허용해 주세요.'); return false; }
    w.document.open(); w.document.write('<!doctype html><meta charset="utf-8"><title>학생 현황</title><body></body>'); w.document.close();
  }
  const link = w.document.createElement('link'); link.rel = 'stylesheet'; link.href = new URL('css/style.css', location.href).href;
  w.document.head.appendChild(link);
  w.document.body.className = 'pip-page';
  w.document.body.innerHTML = '<div id="pip"></div>';
  w.document.body.addEventListener('click', (e) => { if (e.target.closest('.pv-prac')) togglePractice(); });
  w.addEventListener('pagehide', () => { if (pipWin === w) pipWin = null; });
  pipWin = w; renderRoster();
  return true;
}
$('#pipBtn').onclick = () => openPip();
$('#pipHintBtn').onclick = () => openPip();
$('#pipHintX').onclick = () => ($('#pipHint').hidden = true);

/* ───────── 파일 보내기 ─────────
   Firebase 무료 요금제는 파일 저장소(Storage)를 못 써서, 파일을 잘게 나눠 데이터베이스에 넣음.
   files/{lid}/{fid} = {name,size,type,n}, filedata/{lid}/{fid}/c{i} = base64 조각, fileget/{lid}/{fid}/{uid} = 받은 학생 */
const FILE_LIMIT = 20e6, CHUNK = 600000;
function toB64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
const fmtSize = (b) => (b >= 1e6 ? (b / 1e6).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1e3)) + 'KB');
let sentFiles = {}, fileGets = {}, sending = false;
async function sendFiles(list) {
  if (sending || ended) return; sending = true;
  const btn = $('#sendFileBtn');
  try {
    for (const f of list) {
      if (f.size > FILE_LIMIT) { toast(`${f.name}: ${FILE_LIMIT / 1e6}MB보다 큰 파일은 보낼 수 없어요`, 5000); continue; }
      const fid = push(r('files/' + lid)).key;
      const u8 = new Uint8Array(await f.arrayBuffer());
      const n = Math.max(1, Math.ceil(u8.length / CHUNK));
      for (let i = 0; i < n; i++) {
        btn.textContent = `보내는 중 ${Math.round((i / n) * 100)}%`;
        await set(r(`filedata/${lid}/${fid}/c${i}`), toB64(u8.subarray(i * CHUNK, (i + 1) * CHUNK)));
      }
      await set(r(`files/${lid}/${fid}`), { name: f.name, size: f.size, type: f.type || '', n, t: serverTimestamp() });
      toast(`보냈어요: ${f.name}`);
    }
  } catch (er) { toast('보내지 못했어요: ' + er.message, 5000); }
  finally { sending = false; btn.innerHTML = ic('clip') + '파일 보내기'; }
}
$('#sendFileBtn').onclick = () => $('#sendIn').click();
$('#sendIn').onchange = () => { const l = [...$('#sendIn').files]; $('#sendIn').value = ''; if (l.length) sendFiles(l); };
function renderSent() {
  const ids = Object.keys(sentFiles).sort((a, b) => (sentFiles[a].t || 0) - (sentFiles[b].t || 0));
  const box = $('#sentFiles'); box.hidden = !ids.length;
  const total = Object.keys(roster).length;
  box.innerHTML = '<div class="sf-h">보낸 파일</div>' + ids.map((id) => {
    const f = sentFiles[id], got = new Set(Object.keys(fileGets[id] || {}).map((u) => (members[u] ? members[u].sid : u))).size;
    return `<div class="sf"><span class="sf-n" title="${esc(f.name)}">${esc(f.name)}</span><span class="sf-m">${fmtSize(f.size)} · 받음 ${got}${total ? '/' + total : ''}</span><button class="sf-x" data-fid="${id}" title="학생 화면에서 지우기">${ic('x')}</button></div>`;
  }).join('');
}
onValue(r('files/' + lid), (s) => { sentFiles = s.val() || {}; renderSent(); });
onValue(r('fileget/' + lid), (s) => { fileGets = s.val() || {}; renderSent(); });
onValue(r('members/' + lid), () => renderSent());
$('#sentFiles').onclick = (e) => {
  const b = e.target.closest('.sf-x'); if (!b) return;
  const fid = b.dataset.fid;
  update(r(''), { [`files/${lid}/${fid}`]: null, [`filedata/${lid}/${fid}`]: null, [`fileget/${lid}/${fid}`]: null }).catch((er) => toast(er.message));
};

/* 수업 코드 크게 보기 / 종료 */
$('#codePill').onclick = () => {
  $('#cbUrl').textContent = SITE_BASE.replace(/^https?:\/\//, '');
  $('#cbCode').textContent = les.code;
  $('#cbQr').innerHTML = '';
  const draw = () => new QRCode($('#cbQr'), { text: `${SITE_BASE}/?code=${les.code}`, width: 220, height: 220 });
  if (window.QRCode) draw();
  else { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; s.onload = draw; s.onerror = () => ($('#cbQr').hidden = true); document.head.appendChild(s); }
  $('#codeBig').hidden = false;
};
$('#codeBig').onclick = () => ($('#codeBig').hidden = true);
$('#endBtn').onclick = async () => {
  if (!confirm('수업을 끝낼까요?\n출석이 마감되고 학생들은 모두 나가져요.')) return;
  try {
    // 지금 시청 중인 시간까지 확정해서 저장한 뒤 종료
    const t = now(), u = {};
    for (const [sid, m] of Object.entries(meta)) if (m.state === 'active') { m.base += t - m.since; m.since = t; u[`att/${lid}/${skey(sid)}/activeMs`] = Math.round(m.base); }
    if (Object.keys(u).length) await update(r(''), u);
    if (stream) stopShare();
    await closeLesson(lid); showEnded();
  } catch (er) { alert(er.message); }
};

applyLocal(); sendState();
</script>
