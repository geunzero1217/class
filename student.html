<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업 화면</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="student-top">
    <span class="pill" id="conn">연결 중…</span>
    <b id="className"></b>
    <span id="me" class="muted"></span>
    <span class="spacer"></span>
    <span class="pill" id="shareSt" hidden></span>
    <button id="fsBtn" class="small" data-ic="expand">전체 화면</button>
    <button id="logoutBtn" class="small" data-ic="logout">나가기</button>
  </div>
  <div class="notice">이 화면을 벗어나면(다른 탭·창으로 이동) 선생님께 표시됩니다.</div>
  <div class="student-stage"><div id="stageWrap" style="flex:1;display:grid"></div></div>
</div>
<script src="js/common.js"></script>
<script type="module">
import {
  auth, r, get, set, remove, onValue, onChildAdded, onChildChanged, onChildRemoved, onDisconnect, serverTimestamp,
  signOut, waitAuth, iceServers, SlideCache, off,
} from './js/fb.js';

const lid = localStorage.getItem('studentLesson');
const user = await waitAuth();
const toJoin = (msg) => { if (msg) alert(msg); localStorage.removeItem('studentLesson'); location.replace('index.html'); throw new Error('입장 화면으로 이동'); };
if (!lid || !user || !user.isAnonymous) toJoin();
const uid = user.uid;
const me = (await get(r(`members/${lid}/${uid}`))).val();
if (!me) toJoin();
let les = null;
try { les = (await get(r('lessons/' + lid))).val(); } catch (_) { /* */ }
if (!les || les.status !== 'open') toJoin('끝난 수업이에요. 새 수업 코드로 다시 들어오세요.');
$('#className').textContent = `${les.className || ''} · ${les.period}교시`;
$('#me').textContent = `${me.sid} ${me.name || ''}`;
document.title = (les.className || '수업') + ' · 수업 화면';

onValue(r(`lessons/${lid}/status`), (s) => { if (s.val() !== 'open') { cleanup(); toJoin('수업이 끝났어요.'); } });

/* 연결 상태 + 시청 상태 (보이고 + 포커스 있을 때만 '시청 중') */
const presRef = r(`presence/${lid}/${uid}`);
const curStatus = () => (document.visibilityState === 'visible' && document.hasFocus() ? 'active' : 'away');
let lastStatus = null, connected = false;
function report(force) {
  const s = curStatus();
  if (!connected || (s === lastStatus && !force)) return;
  lastStatus = s; set(presRef, { s, t: serverTimestamp() }).catch(() => {});
}
onValue(r('.info/connected'), async (snap) => {
  connected = !!snap.val();
  const c = $('#conn'); c.textContent = connected ? '연결됨' : '연결 끊김 · 다시 연결 중'; c.className = 'pill ' + (connected ? 'ok' : 'bad');
  if (connected) { await onDisconnect(presRef).remove(); report(true); }
});
const soon = () => setTimeout(() => report(), 250);   // iframe 클릭 같은 잠깐의 blur 는 무시
['focus', 'blur', 'pageshow'].forEach((ev) => window.addEventListener(ev, soon));
document.addEventListener('visibilitychange', soon);
setInterval(() => report(), 1000);

function cleanup() { remove(presRef).catch(() => {}); remove(r(`rtc/${lid}/${uid}`)).catch(() => {}); remove(r(`relay/${lid}/want/${uid}`)).catch(() => {}); }
$('#logoutBtn').onclick = async () => {
  if (!confirm('수업에서 나갈까요?')) return;
  cleanup(); await signOut(auth); toJoin();
};
$('#fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };

/* 화면 상태 */
const stage = new Stage($('#stageWrap'));
let st = { mode: 'wait' }, deck = null, deckId = null, key = null, videoReady = false, relay = false, relayGot = false, rtcFail = false;
const slides = new SlideCache(() => render());
function render() {
  let slide = null;
  if (st.mode === 'slides' && st.deckId && deck) {
    slide = slides.url(st.deckId, st.page || 0);
    for (let j = (st.page || 0) + 1; j < Math.min(deck.pages.length, (st.page || 0) + 3); j++) slides.url(st.deckId, j);
  }
  renderView(stage, st, deck, false, { videoReady, relay, slide });
  // 화면 공유 받는 방식 표시
  const ss = $('#shareSt'), sharing = st.mode === 'screen' && st.sharing;
  ss.hidden = !sharing;
  if (sharing) {
    if (relay) { ss.textContent = relayGot ? '사진으로 보는 중 (1초쯤 늦어요)' : '사진 화면 받는 중…'; ss.className = 'pill warn'; }
    else if (videoReady) { ss.textContent = '실시간 영상'; ss.className = 'pill ok'; }
    else if (rtcFail) { ss.textContent = '영상 연결 안 됨 · 다시 시도 중'; ss.className = 'pill bad'; }
    else { ss.textContent = '영상 연결 중…'; ss.className = 'pill'; }
  }
  if (sharing && relay && !relayGot) stage.show('msg', '선생님 화면 사진을 받는 중…<br><span class="small">영상 연결이 안 돼서 사진으로 보여 드려요</span>');
  else if (sharing && !relay && !videoReady && rtcFail) stage.show('msg', '선생님 화면에 연결하지 못했어요<br><b>학교 와이파이</b>에 연결했는지 확인해 주세요<br><span class="small">자동으로 계속 다시 시도하고 있어요</span>');
}
let deckUnsub = null;
function watchDeck() {
  if (st.deckId === deckId) return;
  deckId = st.deckId; deck = null;
  if (deckUnsub) deckUnsub();
  deckUnsub = deckId ? onValue(r(`decks/${les.cid}/${deckId}`), (s) => { deck = s.val(); render(); }) : null;
}
let inkUnsubs = [];
function watchInk() {
  const k = stateKey(st);
  if (k === key) return;
  key = k; inkUnsubs.forEach((u) => u()); inkUnsubs = []; stage.ink.clear(); stage.showLaser(null);
  if (!k) return;
  const ref = r(`ink/${lid}/${k}`);
  inkUnsubs.push(onChildAdded(ref, (s) => stage.ink.upsert(s.key, strokeFromDb(s.val()))));
  inkUnsubs.push(onChildChanged(ref, (s) => stage.ink.upsert(s.key, strokeFromDb(s.val()))));
  inkUnsubs.push(onChildRemoved(ref, (s) => stage.ink.remove(s.key)));
}
onValue(r(`live/${lid}`), (s) => {
  st = s.val() || { mode: 'wait' };
  watchDeck(); watchInk(); syncShare(); render();
});
onValue(r(`pointer/${lid}`), (s) => { const p = s.val(); stage.showLaser(p && p.k === key ? p : null); });

/* 화면 공유 받기: WebRTC(영상) → 10초 안에 안 되면 안내를 띄우고 8초 뒤 다시 시도 (계속 반복)
   선생님이 '사진 보내기'를 켜 두었으면 그동안 사진(우회 전송)으로 보여 줌 */
const rtcRef = r(`rtc/${lid}/${uid}`);
let pc = null, shareId = null, rtcTimer = null, offerUnsub = null, tcUnsub = null, frameUnsub = null, attempt = 0, discTimer = null;
function closePc() {
  if (pc) { pc.close(); pc = null; }
  if (offerUnsub) { offerUnsub(); offerUnsub = null; }
  if (tcUnsub) { tcUnsub(); tcUnsub = null; }
  videoReady = false; stage.video.srcObject = null;
}
function setRelay(on) {
  if (on === relay) return;
  relay = on; relayGot = false;
  const wantRef = r(`relay/${lid}/want/${uid}`);
  if (on) {
    set(wantRef, true).catch(() => {}); onDisconnect(wantRef).remove();
    frameUnsub = onValue(r(`relay/${lid}/frame`), (s) => {
      const f = s.val(); if (!f || !f.d) return;
      stage.relayImg.src = f.d;
      if (!relayGot) { relayGot = true; render(); }
    });
  } else {
    remove(wantRef).catch(() => {});
    if (frameUnsub) { frameUnsub(); frameUnsub = null; }
    stage.relayImg.removeAttribute('src');
  }
  render();
}
function syncShare() {
  const want = st.mode === 'screen' && st.sharing;
  if (!want) { clearTimeout(rtcTimer); closePc(); setRelay(false); rtcFail = false; if (shareId) remove(rtcRef).catch(() => {}); shareId = null; return; }
  if (st.shareId !== shareId) { shareId = st.shareId; attempt = 0; rtcFail = false; closePc(); setRelay(false); requestRtc(); }
  else setRelay(rtcFail && !!st.relay);   // 선생님이 '사진 보내기'를 켜거나 끈 경우
}
function onRtcFail(myShare, myN) {
  if (shareId !== myShare || attempt !== myN) return;
  if (pc && pc.connectionState === 'connected') return;
  rtcFail = true; videoReady = false;
  setRelay(!!st.relay); render();
  clearTimeout(rtcTimer);
  rtcTimer = setTimeout(() => { if (shareId === myShare && attempt === myN) requestRtc(); }, 8000);
}
async function requestRtc() {
  const myShare = shareId, myN = ++attempt;
  closePc(); render();
  await remove(rtcRef).catch(() => {});
  if (shareId !== myShare || attempt !== myN) return;
  await set(rtcRef, { req: shareId, n: myN, t: serverTimestamp() });
  onDisconnect(rtcRef).remove();
  clearTimeout(rtcTimer);
  rtcTimer = setTimeout(() => onRtcFail(myShare, myN), 10000);
  offerUnsub = onValue(r(`rtc/${lid}/${uid}/offer`), async (s) => {
    const o = s.val();
    if (!o || o.shareId !== myShare || (o.n || 0) !== myN || pc) return;
    const my = pc = new RTCPeerConnection({ iceServers });
    my.ontrack = (e) => { stage.video.srcObject = e.streams[0] || new MediaStream([e.track]); stage.video.play().catch(() => {}); if (my.connectionState === 'connected') { videoReady = true; render(); } };
    my.onicecandidate = (e) => { if (e.candidate) set(r(`rtc/${lid}/${uid}/sc/${Date.now()}${Math.random().toString(36).slice(2, 6)}`), e.candidate.toJSON()).catch(() => {}); };
    my.onconnectionstatechange = () => {
      if (pc !== my) return;
      const cs = my.connectionState;
      clearTimeout(discTimer);
      if (cs === 'connected') { clearTimeout(rtcTimer); rtcFail = false; videoReady = !!stage.video.srcObject; setRelay(false); render(); }
      else if (cs === 'failed') onRtcFail(myShare, myN);
      else if (cs === 'disconnected') discTimer = setTimeout(() => { if (pc === my && my.connectionState !== 'connected') onRtcFail(myShare, myN); }, 5000);
    };
    await my.setRemoteDescription({ type: o.type, sdp: o.sdp });
    const ans = await my.createAnswer();
    await my.setLocalDescription(ans);
    await set(r(`rtc/${lid}/${uid}/answer`), { type: ans.type, sdp: ans.sdp, shareId: myShare, n: myN });
    const seen = new Set();
    tcUnsub = onValue(r(`rtc/${lid}/${uid}/tc`), (cs) => {
      cs.forEach((c) => { if (!seen.has(c.key)) { seen.add(c.key); my.addIceCandidate(c.val()).catch(() => {}); } });
    });
  });
}
render();
</script>
</body>
</html>
